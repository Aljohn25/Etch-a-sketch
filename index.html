<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a sketch</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <header>
        <h1>Etch A Sketch</h1>
    </header>

    <main>
        
    <div id="buttons">
        <div class="buttonsTop">
        <button class="resize">RESIZE</button>

        <dialog id="resizeModal">
            <div class = closeBtnResize>
                <p>RESIZE</p>
            <button class="resizeClose">X</button>
            </div>

            <div class="userInput">
            <p> Enter Size: </p>
            <input class="resizeInput">
            </div>
            <div class="enterBtn">
            <button class="enter">ENTER</button>
            <div class="error"></div>
            </div>
            
        </dialog>
        <button class="color">COLOR</button>

        <dialog class="colorModal">
            <div class="colorModalTop">
            <p>COLOR</p>
            <button class="colorClose">X</button>
            </div>

            <div class="colorModalSelect">

                <div class="colorPicker">
                <p>Choose color: </p>
                </div>

                <div class="colorBox">
                <button id="colorBlack" class="colorSelect" data-color="black"></button>
                <button id="colorRed" class="colorSelect" data-color="red"></button>
                <button id="colorGreen" class="colorSelect" data-color="green"></button>
                <button id="colorBlue" class="colorSelect" data-color="blue"></button>
                <button id="colorYellow" class="colorSelect" data-color="yellow"></button>
                <button id="colorPurple" class="colorSelect" data-color="purple"></button>
                </div>
                <div class="colorBox2">
                <button id="colorGrey" class="colorSelect" data-color="grey"></button>
                <button id="colorOrange" class="colorSelect" data-color="orange"></button>
                <button id="colorYellowGreen" class="colorSelect" data-color="yellowgreen"></button>
                <button id="colorLightBlue" class="colorSelect" data-color="lightblue"></button>
                <button id="colorGold" class="colorSelect" data-color="gold"></button>
                <button id="colorIndigo" class="colorSelect" data-color="indigo"></button>
                </div>
                <div class="colorBox3">
                <button id="colorBrown" class="colorSelect" data-color="brown"></button>
                <button id="colorDarkRed" class="colorSelect" data-color="darkred"></button>
                <button id="colorDarkGreen" class="colorSelect" data-color="darkgreen"></button>
                <button id="colorDarkBlue" class="colorSelect" data-color="darkblue"></button>
                <button id="colorPink" class="colorSelect" data-color="pink"></button>
                <button id="colorMagenta" class="colorSelect" data-color="magenta"></button>
                </div>
                <div class="colorBox4">
                <button id="colorTan" class="colorSelect" data-color="tan"></button>
                <button id="colorSalmon" class="colorSelect" data-color="salmon"></button>
                <button id="colorTeal" class="colorSelect" data-color="teal"></button>
                <button id="colorCyan" class="colorSelect" data-color="cyan"></button>
                <button id="colorCoral" class="colorSelect" data-color="coral"></button>
                <button id="colorPlum" class="colorSelect" data-color="plum"></button>
                </div>
                    
                
            </div>

            <div class="colorModalButtons">
                <button class="colorConfirm">CONFIRM</button>
                <button class="colorCancel">CANCEL</button>
            </div>
            
        </dialog>

        <button class="resetBtn">RESET</button>
        <dialog class="resetModal">
            <div class="resetModalTop">
            <p>RESET</p>
            <button class="resetClose">X</button>
            </div>

            <div class="resetModalBottom">
                <p>Are you sure you want to reset?</p>
                <div class="resetModalButtons">
                    <button class="reset">YES</button>
                    <button class="noReset">NO</button>
                </div>
            </div>
        </dialog>
        </div>
    
    <div class="buttonsBottom">
        <button class="draw">MODE:CLICK</button>
        <button class="erase">ERASE:OFF</button>
        <button class="save">SAVE</button>

    </div>

    </div> 
    <div id="sketchPad"></div>
   
    
    </main>

    <footer> <h6>Copyrights Etch A Sketch Project by Aljohn Moorhead</h6>
    </footer>
    
</body>
</html>
